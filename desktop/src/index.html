<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRemote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: rgba(22, 22, 24, 0.6);
      color: #c8c8cc;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      -webkit-app-region: drag;
    }
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .navbar-logo {
      width: 22px;
      height: 22px;
    }
    .navbar-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    .navbar-name {
      font-size: 13px;
      font-weight: 600;
      color: #f0f0f2;
      letter-spacing: -0.2px;
    }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .activity-label {
      font-size: 11px;
      color: #5a5a62;
    }

    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 16px;
    }

    .qr-container {
      position: relative;
    }
    .qr-section {
      text-align: center;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
    }
    .qr-section img {
      width: 160px;
      height: 160px;
      border-radius: 10px;
      background: #fff;
      padding: 8px;
    }
    .qr-label {
      font-size: 11px;
      color: #5a5a62;
      margin-bottom: 10px;
    }

    .connected-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .connected-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(52,211,153,0.1);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .connected-title {
      font-size: 16px;
      font-weight: 600;
      color: #f0f0f2;
    }
    .connected-sub {
      font-size: 12px;
      color: #6e6e76;
    }

    .status-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3a3a40;
    }
    .status-dot.active { background: #34d399; }
    .status-dot.connecting { background: #f59e0b; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .status-text {
      font-size: 11px;
      color: #6e6e76;
    }

    .connection-stats {
      display: flex;
      gap: 14px;
      font-size: 11px;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #5a5a62;
    }
    .stat-value {
      color: #8e8e96;
      font-variant-numeric: tabular-nums;
    }

    .activity-panel {
      width: 260px;
      background: rgba(0,0,0,0.15);
      border-left: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
    }
    .activity-count {
      font-size: 10px;
      color: #4a4a52;
      background: rgba(255,255,255,0.04);
      padding: 2px 7px;
      border-radius: 10px;
    }
    .activity-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .activity-item {
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 2px;
      font-size: 11px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .activity-item:hover {
      background: rgba(255,255,255,0.03);
    }
    .activity-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .activity-icon.connect { background: rgba(52,211,153,0.12); color: #34d399; }
    .activity-icon.disconnect { background: rgba(248,113,113,0.12); color: #f87171; }
    .activity-icon.command { background: rgba(129,140,248,0.12); color: #818cf8; }
    .activity-icon.system { background: rgba(251,191,36,0.12); color: #fbbf24; }
    .activity-content {
      flex: 1;
      min-width: 0;
    }
    .activity-text {
      color: #8e8e96;
      line-height: 1.4;
      word-break: break-word;
    }
    .activity-time {
      font-size: 10px;
      color: #4a4a52;
      margin-top: 2px;
    }
    .activity-empty {
      text-align: center;
      padding: 40px 20px;
      color: #4a4a52;
      font-size: 12px;
    }

    .footer {
      padding: 8px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version {
      font-size: 10px;
      color: #3a3a42;
    }
    .footer-link {
      font-size: 10px;
      color: #4a4a52;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    .footer-link:hover { color: #8e8e96; }
    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      color: #6e6e76;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.08);
      color: #c8c8cc;
      border-color: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="navbar-left">
      <div class="navbar-logo"><img src="assets/trasnprtnt-logo.png" alt="OpenRemote" /></div>
      <span class="navbar-name">OpenRemote</span>
    </div>
    <div class="navbar-right">
      <span class="activity-label">Activity</span>
      <span class="activity-count" id="activityCount">0</span>
    </div>
  </div>

  <div class="container">
    <div class="main-panel">
      <div id="viewQR">
        <div class="qr-container">
          <div class="qr-section">
            <img id="qrCode" alt="QR Code" />
          </div>
        </div>
        <div class="status-section" style="margin-top: 12px;">
          <div class="status-bar">
            <span class="status-dot connecting" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
          </div>
        </div>
      </div>

      <div id="viewConnected" style="display: none;">
        <div class="connected-state">
          <div class="connected-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <div class="connected-title">Connected</div>
          <div class="connected-sub"><span id="connectedDevices">1</span> device · <span id="connectedSessions">0</span> sessions</div>
        </div>
      </div>
    </div>

    <div class="activity-panel">
      <div class="activity-list" id="activityList">
        <div class="activity-empty">No activity yet</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <span class="version">v1.0.0</span>
      <span class="footer-link" id="tunnelInfo">Starting up...</span>
    </div>
    <div class="footer-right">
      <button class="btn" id="btnCopyUrl">Copy URL</button>
      <button class="btn" id="btnRegenToken">Reset Pairing</button>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    let tunnelUrl = null;
    let clientCount = 0;
    let sessionCount = 0;
    let activityCount = 0;

    function updateStatus() {
      if (tunnelUrl && clientCount > 0) {
        $('#viewQR').style.display = 'none';
        $('#viewConnected').style.display = '';
        $('#connectedDevices').textContent = clientCount;
        $('#connectedSessions').textContent = sessionCount;
        $('#tunnelInfo').textContent = 'Connected';
        $('#tunnelInfo').style.color = '#34d399';
      } else {
        $('#viewQR').style.display = '';
        $('#viewConnected').style.display = 'none';
        if (tunnelUrl) {
          $('#statusDot').className = 'status-dot active';
          $('#statusText').textContent = 'Ready — scan to connect';
          $('#tunnelInfo').textContent = 'Ready';
          $('#tunnelInfo').style.color = '#34d399';
        } else {
          $('#statusDot').className = 'status-dot connecting';
          $('#statusText').textContent = 'Connecting...';
          $('#tunnelInfo').textContent = 'Starting up...';
          $('#tunnelInfo').style.color = '#f59e0b';
        }
      }
    }

    function addActivity(type, message) {
      const list = $('#activityList');
      const empty = list.querySelector('.activity-empty');
      if (empty) empty.remove();

      const icons = {
        connect: '↗',
        disconnect: '↙',
        command: '>_',
        system: '⚡'
      };

      const item = document.createElement('div');
      item.className = 'activity-item';
      item.innerHTML = `
        <div class="activity-icon ${type}">${icons[type] || '•'}</div>
        <div class="activity-content">
          <div class="activity-text">${escapeHtml(message)}</div>
          <div class="activity-time">${new Date().toLocaleTimeString()}</div>
        </div>
      `;
      list.insertBefore(item, list.firstChild);

      activityCount++;
      $('#activityCount').textContent = activityCount;

      while (list.children.length > 50) {
        list.removeChild(list.lastChild);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadStatus() {
      const status = await window.clawRemote.getStatus();
      tunnelUrl = status.tunnelUrl;
      clientCount = status.connectedClients;
      sessionCount = status.activeSessions?.length || 0;
      updateStatus();

      if (tunnelUrl) {
        addActivity('system', 'Ready');
      }

      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    }

    window.clawRemote.onTunnelUrl(async (url) => {
      tunnelUrl = url;
      updateStatus();
      addActivity('system', 'Ready for pairing');
      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    });

    window.clawRemote.onSessions((sessions) => {
      sessionCount = sessions?.length || 0;
      updateStatus();
    });

    window.clawRemote.onLog((entry) => {
      if (entry.message.includes('authenticated')) {
        clientCount++;
        updateStatus();
        addActivity('connect', 'Device connected');
      } else if (entry.message.includes('disconnected') && !entry.message.includes('unknown')) {
        clientCount = Math.max(0, clientCount - 1);
        updateStatus();
        addActivity('disconnect', 'Device disconnected');
      } else if (entry.message.includes('Session created')) {
        addActivity('command', 'Session started');
      } else if (entry.message.includes('Session') && entry.message.includes('exited')) {
        addActivity('command', 'Session ended');
      }
    });

    $('#btnCopyUrl').addEventListener('click', async () => {
      if (tunnelUrl) {
        await navigator.clipboard.writeText(tunnelUrl);
        const btn = $('#btnCopyUrl');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy URL', 1500);
      }
    });

    $('#btnRegenToken').addEventListener('click', async () => {
      if (confirm('This will disconnect all paired devices and generate a new pairing code. Continue?')) {
        await window.clawRemote.regenerateToken();
        const qr = await window.clawRemote.getQRCode();
        if (qr) $('#qrCode').src = qr;
        clientCount = 0;
        updateStatus();
        addActivity('system', 'Pairing reset');
      }
    });

    loadStatus();
  </script>
</body>
</html>
