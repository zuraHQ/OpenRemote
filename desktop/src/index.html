<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claw Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; font-weight: 600; color: #fff; }
    .header h1 span { color: #00ff88; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #444; display: inline-block; margin-right: 6px;
    }
    .status-dot.active { background: #00ff88; }
    .status-dot.connecting { background: #ffaa00; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 12px; color: #888; }

    .content { flex: 1; overflow-y: auto; padding: 20px; }

    .qr-section { text-align: center; margin-bottom: 20px; }
    .qr-section img { border-radius: 8px; background: #fff; padding: 8px; }
    .qr-label { font-size: 12px; color: #888; margin-top: 8px; }

    .card {
      background: #111128; border: 1px solid #1a1a2e;
      border-radius: 8px; padding: 12px 16px; margin-bottom: 12px;
    }
    .card-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #666; margin-bottom: 4px;
    }
    .card-value {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px; color: #fff; word-break: break-all; user-select: all;
    }
    .card-value.green { color: #00ff88; }
    .card-value.yellow { color: #ffaa00; }

    .btn {
      background: #1a1a2e; border: 1px solid #2a2a4e; color: #ccc;
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #2a2a4e; color: #fff; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }

    .sessions-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .session-chip {
      background: #1a2e1a; border: 1px solid #2a4e2a; color: #00ff88;
      padding: 4px 10px; border-radius: 12px; font-size: 11px; font-family: monospace;
    }

    .logs-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .logs-header {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #666; margin-bottom: 8px;
    }
    .logs {
      flex: 1; background: #050510; border: 1px solid #1a1a2e; border-radius: 8px;
      padding: 8px 12px; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px; line-height: 1.6; overflow-y: auto;
      min-height: 120px; max-height: 200px;
    }
    .log-entry { color: #888; }
    .log-entry .time { color: #555; }
    .log-entry .msg { color: #aaa; }
  </style>
</head>
<body>

  <div class="header">
    <h1><span>></span> Claw Remote</h1>
    <div style="display: flex; align-items: center;">
      <span class="status-dot connecting" id="statusDot"></span>
      <span class="status-text" id="statusText">Starting...</span>
    </div>
  </div>

  <div class="content">
    <div class="qr-section">
      <img id="qrCode" width="180" height="180" alt="QR Code" />
      <div class="qr-label">Scan with Claw Remote on your phone</div>
    </div>

    <div class="card">
      <div class="card-label">Tunnel URL</div>
      <div class="card-value yellow" id="tunnelUrl">Connecting...</div>
    </div>

    <div class="card">
      <div class="card-label">Pairing Token</div>
      <div class="card-value" id="tokenValue">Loading...</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="btnRefreshQR">Refresh QR</button>
      <button class="btn" id="btnRegenToken">New Token</button>
      <button class="btn" id="btnCopyToken">Copy Token</button>
    </div>

    <div class="card">
      <div class="card-label">Active Sessions</div>
      <div class="sessions-list" id="sessionsList">
        <span style="color: #555; font-size: 12px;">None</span>
      </div>
    </div>

    <div class="logs-section">
      <div class="logs-header">Connection Logs</div>
      <div class="logs" id="logsContainer"></div>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function appendLog(entry) {
      const logsEl = $('#logsContainer');
      const div = document.createElement('div');
      div.className = 'log-entry';
      const time = new Date(entry.time).toLocaleTimeString();
      div.innerHTML = `<span class="time">${time}</span> <span class="msg">${escapeHtml(entry.message)}</span>`;
      logsEl.appendChild(div);
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    function updateSessions(sessionIds) {
      const el = $('#sessionsList');
      if (!sessionIds || sessionIds.length === 0) {
        el.innerHTML = '<span style="color: #555; font-size: 12px;">None</span>';
        return;
      }
      el.innerHTML = sessionIds.map(id =>
        `<span class="session-chip">${id}</span>`
      ).join('');
    }

    async function loadStatus() {
      const status = await window.clawRemote.getStatus();

      $('#tokenValue').textContent = status.authToken;

      if (status.tunnelUrl) {
        $('#tunnelUrl').textContent = status.tunnelUrl;
        $('#tunnelUrl').className = 'card-value green';
        $('#statusDot').className = 'status-dot active';
        $('#statusText').textContent = `${status.connectedClients} client(s)`;
      } else {
        $('#tunnelUrl').textContent = 'Connecting...';
        $('#tunnelUrl').className = 'card-value yellow';
      }

      updateSessions(status.activeSessions);

      const logsEl = $('#logsContainer');
      logsEl.innerHTML = '';
      for (const entry of status.logs) {
        appendLog(entry);
      }

      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    }

    window.clawRemote.onLog((entry) => appendLog(entry));

    window.clawRemote.onTunnelUrl(async (url) => {
      $('#tunnelUrl').textContent = url;
      $('#tunnelUrl').className = 'card-value green';
      $('#statusDot').className = 'status-dot active';
      $('#statusText').textContent = 'Ready';
      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    });

    window.clawRemote.onSessions((sessions) => updateSessions(sessions));

    $('#btnRefreshQR').addEventListener('click', async () => {
      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    });

    $('#btnRegenToken').addEventListener('click', async () => {
      if (confirm('This will disconnect all paired devices. Continue?')) {
        const newToken = await window.clawRemote.regenerateToken();
        $('#tokenValue').textContent = newToken;
        const qr = await window.clawRemote.getQRCode();
        if (qr) $('#qrCode').src = qr;
      }
    });

    $('#btnCopyToken').addEventListener('click', () => {
      navigator.clipboard.writeText($('#tokenValue').textContent);
      const btn = $('#btnCopyToken');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy Token', 1500);
    });

    loadStatus();
  </script>
</body>
</html>
