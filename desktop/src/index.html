<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRemote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 14px 20px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0a0a0a;
    }
    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .header h1 span { color: #00ff88; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #333; display: inline-block; margin-right: 6px;
    }
    .status-dot.active { background: #00ff88; }
    .status-dot.connecting { background: #ffaa00; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 12px; color: #666; }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      background: #0a0a0a;
      border-right: 1px solid #222;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toggle-btn {
      background: none;
      border: 1px solid #222;
      color: #444;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-btn:hover { color: #888; border-color: #333; }
    .toggle-btn.active { color: #00ff88; border-color: #00ff88; }

    .collapsible {
      display: none;
    }
    .collapsible.show {
      display: block;
    }

    .section-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .qr-section { text-align: center; }
    .qr-section img { 
      border-radius: 8px; 
      background: #fff; 
      padding: 6px;
      width: 140px;
      height: 140px;
    }
    .qr-label { font-size: 11px; color: #555; margin-top: 8px; }

    .info-block { }
    .info-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #444; margin-bottom: 4px;
    }
    .info-value {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px; color: #888; word-break: break-all; user-select: all;
    }
    .info-value.green { color: #00ff88; }
    .info-value.yellow { color: #ffaa00; }

    .btn {
      background: #111; border: 1px solid #222; color: #666;
      padding: 6px 10px; border-radius: 4px; font-size: 11px;
      cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { background: #1a1a1a; color: #fff; border-color: #333; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }

    .sessions-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .session-chip {
      background: #0a1a0a; border: 1px solid #1a2a1a; color: #00ff88;
      padding: 2px 8px; border-radius: 10px; font-size: 10px; font-family: monospace;
    }

    .terminal-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .terminal-header {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 10px 16px;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
    }
    .terminal-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #444;
    }
    .terminal-badge {
      background: #0a1a0a; border: 1px solid #1a2a1a; color: #00ff88;
      padding: 2px 8px; border-radius: 10px; font-size: 10px; font-family: monospace;
    }

    .terminal-output {
      flex: 1;
      background: #000;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.5;
      overflow-y: auto;
      color: #00ff88;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .logs-panel {
      height: 120px;
      background: #050505;
      border-top: 1px solid #222;
      overflow-y: auto;
      padding: 10px 16px;
    }
    .logs-panel.collapsible { display: none; }
    .logs-panel.collapsible.show { display: block; }
    .log-entry { font-size: 11px; font-family: monospace; color: #444; line-height: 1.5; }
    .log-entry .time { color: #333; }
    .log-entry .msg { color: #555; }

    .panel-bar {
      display: flex;
      background: #0a0a0a;
      border-top: 1px solid #222;
      padding: 0;
    }
    .panel-tab {
      background: none;
      border: none;
      color: #444;
      padding: 6px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .panel-tab:hover { color: #888; }
    .panel-tab.active { color: #00ff88; background: #050505; }

    .close-btn {
      background: none;
      border: none;
      color: #444;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      transition: color 0.15s;
    }
    .close-btn:hover { color: #ff4444; }
  </style>
</head>
<body>

  <div class="header">
    <h1><span>></span> OpenRemote</h1>
    <div style="display: flex; align-items: center;">
      <span class="status-dot connecting" id="statusDot"></span>
      <span class="status-text" id="statusText">Starting...</span>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="qr-section">
        <img id="qrCode" alt="QR Code" />
        <div class="qr-label">Scan to connect</div>
      </div>

      <div class="info-block">
        <div class="info-label">Sessions</div>
        <div class="sessions-list" id="sessionsList">
          <span style="color: #333; font-size: 11px;">None</span>
        </div>
      </div>

      <div class="info-block">
        <div class="section-toggle">
          <span class="info-label">Settings</span>
          <button class="toggle-btn" id="toggleSettings">Show</button>
        </div>
        <div class="collapsible" id="settingsPanel">
          <div style="margin-bottom: 12px;">
            <div class="info-label" style="margin-bottom: 4px;">Tunnel</div>
            <div class="info-value yellow" id="tunnelUrl">Connecting...</div>
          </div>
          <div style="margin-bottom: 12px;">
            <div class="info-label" style="margin-bottom: 4px;">Token</div>
            <div class="info-value" id="tokenValue">...</div>
          </div>
          <div class="btn-row">
            <button class="btn" id="btnRegenToken">Regenerate</button>
            <button class="btn" id="btnCopyToken">Copy</button>
          </div>
        </div>
      </div>

      <div class="info-block">
        <div class="section-toggle">
          <span class="info-label">Terminal</span>
          <button class="toggle-btn" id="toggleTerminal">Show</button>
        </div>
      </div>
    </div>

    <div class="terminal-area collapsible" id="terminalPanel">
      <div class="terminal-header">
        <span class="terminal-label">Terminal Output</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="terminal-badge" id="terminalStatus">Waiting...</span>
          <button class="close-btn" id="closeTerminal">×</button>
        </div>
      </div>
      <div class="terminal-output" id="terminalOutput"></div>
      <div class="logs-panel collapsible" id="logsPanel">
        <div id="logsContainer"></div>
      </div>
      <div class="panel-bar">
        <button class="panel-tab" id="toggleLogs">Logs</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function appendLog(entry) {
      const logsEl = $('#logsContainer');
      const div = document.createElement('div');
      div.className = 'log-entry';
      const time = new Date(entry.time).toLocaleTimeString();
      div.innerHTML = `<span class="time">${time}</span> <span class="msg">${escapeHtml(entry.message)}</span>`;
      logsEl.appendChild(div);
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    function updateSessions(sessionIds) {
      const el = $('#sessionsList');
      if (!sessionIds || sessionIds.length === 0) {
        el.innerHTML = '<span style="color: #333; font-size: 11px;">None</span>';
        return;
      }
      el.innerHTML = sessionIds.map(id =>
        `<span class="session-chip">${id}</span>`
      ).join('');
    }

    async function loadStatus() {
      const status = await window.clawRemote.getStatus();

      $('#tokenValue').textContent = status.authToken;

      if (status.tunnelUrl) {
        $('#tunnelUrl').textContent = status.tunnelUrl;
        $('#tunnelUrl').className = 'info-value green';
        $('#statusDot').className = 'status-dot active';
        $('#statusText').textContent = `${status.connectedClients} client(s)`;
      } else {
        $('#tunnelUrl').textContent = 'Connecting...';
        $('#tunnelUrl').className = 'info-value yellow';
      }

      updateSessions(status.activeSessions);

      const logsEl = $('#logsContainer');
      logsEl.innerHTML = '';
      for (const entry of status.logs) {
        appendLog(entry);
      }

      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    }

    window.clawRemote.onLog((entry) => appendLog(entry));

    window.clawRemote.onTunnelUrl(async (url) => {
      $('#tunnelUrl').textContent = url;
      $('#tunnelUrl').className = 'info-value green';
      $('#statusDot').className = 'status-dot active';
      $('#statusText').textContent = 'Ready';
      const qr = await window.clawRemote.getQRCode();
      if (qr) $('#qrCode').src = qr;
    });

    window.clawRemote.onSessions((sessions) => updateSessions(sessions));

    // Strip ANSI escape codes and control characters
    function cleanTerminalOutput(str) {
      return str
        .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
        .replace(/\x1b\][^\x07]*\x07/g, '')
        .replace(/\x1b[()][AB012]/g, '')
        .replace(/\x1b\[[\?]?[0-9;]*[hlm]/g, '')
        .replace(/\x1b=/g, '')
        .replace(/\x07/g, '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/\n{3,}/g, '\n\n');
    }

    window.clawRemote.onTerminalOutput(({ sessionId, data }) => {
      const termEl = $('#terminalOutput');
      const statusEl = $('#terminalStatus');
      statusEl.textContent = `Session: ${sessionId}`;
      const cleanData = cleanTerminalOutput(data);
      termEl.textContent += cleanData;
      if (termEl.textContent.length > 10000) {
        termEl.textContent = termEl.textContent.slice(-8000);
      }
      termEl.scrollTop = termEl.scrollHeight;
    });

    $('#btnRegenToken').addEventListener('click', async () => {
      if (confirm('This will disconnect all paired devices. Continue?')) {
        const newToken = await window.clawRemote.regenerateToken();
        $('#tokenValue').textContent = newToken;
        const qr = await window.clawRemote.getQRCode();
        if (qr) $('#qrCode').src = qr;
      }
    });

    $('#btnCopyToken').addEventListener('click', () => {
      navigator.clipboard.writeText($('#tokenValue').textContent);
      const btn = $('#btnCopyToken');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    });

    // Toggle settings panel
    $('#toggleSettings').addEventListener('click', () => {
      const panel = $('#settingsPanel');
      const btn = $('#toggleSettings');
      panel.classList.toggle('show');
      btn.textContent = panel.classList.contains('show') ? 'Hide' : 'Show';
      btn.classList.toggle('active', panel.classList.contains('show'));
    });

    // Toggle terminal panel
    $('#toggleTerminal').addEventListener('click', () => {
      const panel = $('#terminalPanel');
      const btn = $('#toggleTerminal');
      panel.classList.toggle('show');
      btn.textContent = panel.classList.contains('show') ? 'Hide' : 'Show';
      btn.classList.toggle('active', panel.classList.contains('show'));
    });

    // Close terminal panel
    $('#closeTerminal').addEventListener('click', () => {
      const panel = $('#terminalPanel');
      const btn = $('#toggleTerminal');
      panel.classList.remove('show');
      btn.textContent = 'Show';
      btn.classList.remove('active');
    });

    // Toggle logs panel
    $('#toggleLogs').addEventListener('click', () => {
      const panel = $('#logsPanel');
      const btn = $('#toggleLogs');
      panel.classList.toggle('show');
      btn.classList.toggle('active', panel.classList.contains('show'));
    });

    loadStatus();
  </script>
</body>
</html>
